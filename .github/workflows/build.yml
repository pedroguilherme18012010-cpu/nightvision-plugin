
name: Compilar NightVision

on:
  workflow_dispatch:
  push:
  branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Extrair projeto
        run: unzip nightvision-paper-plugin-source.zip

      - name: Compilar plugin
        run: |
          cd nightvision-paper-plugin
          mvn -B clean package

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: NightVision-Plugin
          path: nightvision-paper-plugin/target/*.jar
